<html lang="he" dir="rtl">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              ariel: {
                green: '#90C030',
                dark: '#1a1a1a',
                gray: '#f3f4f6'
              }
            },
            fontFamily: {
              sans: ['Rubik', 'sans-serif'],
              display: ['Heebo', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
      .ariel-dark-gradient { background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%); }
      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
      
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
      .floating-icon { animation: float 4s ease-in-out infinite; }
      
      @keyframes heartbeat { 
        0% { transform: scale(1); } 
        14% { transform: scale(1.15); } 
        28% { transform: scale(1); } 
        42% { transform: scale(1.15); } 
        70% { transform: scale(1); } 
      }
      .heartbeat-anim { animation: heartbeat 0.8s infinite; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #90C030; border-radius: 4px; }
    </style>
